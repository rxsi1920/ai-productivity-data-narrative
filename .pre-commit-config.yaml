repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: uv-export
        name: export requirements.txt
        entry: uv export
        args:
          - --frozen
          - --no-dev
          - --no-hashes
          - --no-emit-project
          - --no-header
          - --no-annotate
          - -o
          - requirements.txt
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false




