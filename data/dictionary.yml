        simulated content for “fraud disinformation or digital violence” without authentication/visible labeling (Ch. X Art.
        38(V) p. 33). It also prohibits AI that generates/disseminates child sexual exploitation material including hyperrealism
        “deep lies” (Ch. XIV Art. 63(V) pp. 46–47). And it embeds non-discrimination on gender as a guiding principle (“Equity”)
        (Defs. p. 8).
