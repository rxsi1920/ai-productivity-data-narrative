- id: hp_definitions
  source_ids:
  - schaeffer_2025
  sample: data/raw/human_practice/schaeffer/section_a_schaeffer_table.csv
  processed_output: data/processed/human_practice/definitions.csv
  format: csv
  primary_key:
  - id
  minimum_rows: 8
  columns:
    id:
      type: integer
      role: identifier
      nullable: false
    definition:
      type: string
      role: dimension
      nullable: false
      allowed_values:
      - Any Increase of Population Risk
      - Appearance of Hallucinated Data
      - Asymptotically Diverging Population Risk
      - Catastrophic Increase of Population Risk
      - Change in Scaling Law
      - Collapsing Variance
      - Disappearance of Real Tail Data
      - Disappearance of or Entanglement of Real Data Mode(s)
    details:
      type: string
      role: dimension
      nullable: false
      allowed_values:
      - Collapse if the link between performance and training data size deviates from the scaling seen with real data. (Sec.
        2)
      - Critical, rapid degradation in performance from synthetic data, measured by population risk (expected loss over the
        real data distribution). "Catastrophic" is often undefined. (Sec. 2)
      - Models begin producing fully synthetic data not supported by the original real data's distribution. (Sec. 2)
      - Population risk grows without bound over successive model-fitting iterations. (Sec. 2)
      - 'Strict: collapse if there is any increase in population risk when training with synthetic data versus real data alone.
        (Sec. 2)'
      - Synthetic data stops the model learning some modes of the real distribution, or blurs modes together ("mode collapse").
        (Sec. 2)
      - Synthetic data under-represents the tail of the distribution ("coverage collapse"), so models handle common cases
        but fail on rare ones. Can be subtler than Def. 4. (Sec. 2)
      - Variance or diversity trends to 0, and learned distributions become delta-like over iterations. (Sec. 2)
    realistic_condition:
      type: string
      role: dimension
      nullable: false
      allowed_values:
      - Not tied to a specific condition in the paper.
      - 'Not tied to a specific condition. Example: Shumailov et al.''s OPT-125M result counted as Def. 8; perplexity plateaued
        12.5% to 50% above the first model. (Sec. 2.1)'
      - 'Not tied to a specific condition. Listed in two families: "distributions deforming" and "decreasing value from additional
        data". (Sec. 2)'
      - Not tied to a specific condition. Real share of data is expected to approach zero, but whether it reaches zero is
        unclear. (Sec. 3, 4.2, 5)
      - 'Replace paradigm (old data deleted, next model trained only on the newest synthetic data) is "highly unrealistic".
        Realistic: more compute, more and higher-quality data, synthetic data accumulating beside real data. (Sec. 3, 4.1)'
      - Replace paradigm is unrealistic, but "very real threats to tails" remain. (Sec. 1, 3)
      - Replace paradigm is unrealistic. Schaeffer et al. cite about 1 quadrillion available pre-training tokens (attributed
        to Villalobos et al. 2024). (Sec. 3, 4.1, 4.4)
      - 'Replace paradigm is unrealistic; real data is not deleted after each model. Realistic: synthetic data accumulates,
        and real data''s share falls. (Sec. 3, 4.1)'
    mitigation:
      type: string
      role: dimension
      nullable: false
      allowed_values:
      - 'Accumulate data (shown empirically and mathematically). Accumulate-subsample: loss appears to stabilise, but no theory
        yet. A real-data share above zero is sufficient, not necessary. Iterative retraining is not used in frontier models.
        (Sec. 4.1 to 4.3)'
      - Accumulate real and synthetic data instead of replacing it. Population risk diverges under replace, not under accumulate.
        (Sec. 4.1)
      - Further research on how synthetic data affects scaling behaviour. (Sec. 5)
      - 'More research on coverage and mode-collapse prevention for realistic settings. Possible idea: sequester real data
        for later use (labs have already collected it). (Sec. 4.2, 5)'
      - Not given for this definition. (Alemohammad et al. saw FID rise 2x by iteration 5, then plateau; Gerstgrasser et al.
        questioned calling it collapse. Sec. 2.2)
      - Not given. Search providers may pay a high penalty if trained on hallucinated facts. (Sec. 2.3)
      - Research on coverage and mode-collapse prevention. Harms can fall disproportionately on marginalised groups. (Sec.
        2.3, 5)
      - 'Timescale matters: expected iterations before total collapse scale with data size times entropy. At face value, trillions
        of models could be trained before onset. (Sec. 4.4)'
    rebuttal:
      type: string
      role: dimension
      nullable: false
      allowed_values:
      - 'In that simple model, total collapse poses "virtually no present threat". Regression case (App. A, Table 1): no collapse
        under either paradigm. Authors note the model is simple.'
      - 'Not addressed in the Sec. 5 forecast. Regression case (App. A, Table 1): no collapse under either paradigm.'
      - 'Not rebutted. Regression case (App. A, Table 1): collapse occurs under both accumulate and replace. The Sec. 5 forecast
        covers catastrophic and diverging risk, not any increase.'
      - 'Not rebutted: exact changes under realistic conditions "remain to be determined". Synthetic data could ease a data
        bottleneck but may alter scaling-law parameters. Regression case (App. A, Table 1): collapse under both.'
      - 'Not rebutted: loss of diversity is "a real issue"; how much tail is lost is unclear. Regression case (App. A, Table
        1): no collapse under either paradigm.'
      - 'Not rebutted: real tail data and modes will be lost, but how many and how quickly is unclear. Regression case (App.
        A, Table 1): no collapse under either paradigm.'
      - 'Sec. 5: population risk will not diverge asymptotically under accumulating data. Regression case (App. A, Table 1):
        no collapse under accumulate; collapse under replace.'
      - 'Sec. 5: with accumulating data and larger, higher-quality datasets, population risk will not increase catastrophically.
        Regression case (App. A, Table 1): no collapse under accumulate; collapse under replace.'
    papers:
      type: string
      role: dimension
      nullable: false
      allowed_values:
      - Alemohammad et al. 2023
      - Alemohammad et al. 2023; Dohmatob et al. 2024b
      - Alemohammad et al. 2023; Shumailov et al. 2023; Bertrand et al. 2023
      - Dohmatob et al. 2024b; Bertrand et al. 2023; Kazdan et al. 2024b
      - Dohmatob et al. 2024c
      - Gerstgrasser et al. 2024; Kazdan et al. 2024b; Dey & Donoho 2024
      - Shumailov et al. 2023; Alemohammad et al. 2023; Bohacek & Farid 2023
      - Shumailov et al. 2023; Wyllie et al. 2024; Shumailov et al. 2024
    short_name:
      type: string
      role: dimension
      nullable: false
      allowed_values:
      - Any increase of population risk
      - Appearance of hallucinated data
      - Asymptotically diverging population risk
      - Catastrophic increase of population risk
      - Change in scaling law
      - Collapsing variance
      - Disappearance of real tail data
      - Disappearance or entanglement of real data modes
    families:
      type: string
      role: dimension
      nullable: false
      allowed_values:
      - Distributions deforming
      - Distributions deforming | Decreasing value from additional data
      - Population risk degrading
    collapse_accumulate:
      type: boolean
      role: dimension
      nullable: false
      allowed_values:
      - false
      - true
    collapse_replace:
      type: boolean
      role: dimension
      nullable: false
      allowed_values:
      - false
      - true
    covered_in:
      type: string
      role: dimension
      nullable: false
      allowed_values:
      - Loss and compute charts
      - Loss chart (partly)
      - Not covered
    coverage_note:
      type: string
      role: dimension
      nullable: false
      allowed_values:
      - 'Both are about the scaling law: what added AI text does to loss at a fixed human-token budget, and the compute multiplier
        that follows.'
      - No chart checks whether model output is supported by the real data.
      - No chart measures how a model handles rare cases.
      - No chart measures variance or diversity.
      - No chart shows a model losing or merging modes. The web-composition chart describes what the web contains, not what
        a model has lost.
      - No chart tests catastrophic degradation. The loss chart shows changes of a few per cent when AI text is mixed into
        human data, which is not recursive training.
      - The loss chart compares loss with added AI text against a human-only control, so a rise is an increase in risk by
        this definition. Loss is measured on C4 as a proxy for the real distribution, and with mixing, not recursion.
      - This needs successive generations of models; the WildAI models are single-generation mixes of human and AI text.
