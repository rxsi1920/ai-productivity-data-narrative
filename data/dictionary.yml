- id: hp_evidence
  source_ids:
  - workforce_evidence
  sample: data/raw/human_practice/workforce/evidence.csv
  processed_output: data/processed/human_practice/evidence.csv
  format: csv
  date_column: year
  latest_observation: '2025-01-01'
  primary_key:
  - id
  minimum_rows: 6
  columns:
    id:
      type: string
      role: identifier
      nullable: false
    panel:
      type: string
      role: dimension
      nullable: false
      allowed_values:
      - output
      - skill
    panel_title:
      type: string
      role: dimension
      nullable: false
      allowed_values:
      - Output gains
      - Skill and learning signals
    label:
      type: string
      role: dimension
      nullable: false
      allowed_values:
      - Brynjolfsson et al. 2023
      - Brynjolfsson et al. 2023 (learning)
      - Dell'Acqua et al. 2023 (inside the frontier)
      - Dell'Acqua et al. 2023 (outside the frontier)
      - Lee et al. 2025
      - Noy & Zhang 2023
    short_label:
      type: string
      role: dimension
      nullable: false
      allowed_values:
      - +12.2% tasks
      - +14% issues/hr
      - 84% vs 60-70% correct
      - Less critical thinking
      - Possible learning
      - ~37% faster
    year:
      type: date
      role: time
      nullable: false
      date_minimum: '2023-01-01'
      date_maximum: '2025-01-01'
    design:
      type: string
      role: dimension
      nullable: false
      allowed_values:
      - Pre-registered randomised field experiment
      - Randomised online experiment
      - Self-reported survey
      - Staggered rollout at one firm
    sample_size:
      type: integer
      role: measure
      nullable: false
      unit: people (see sample_unit)
      minimum: 319
      maximum: 5179
    sample_unit:
      type: string
      role: dimension
      nullable: false
      allowed_values:
      - college-educated professionals
      - consultants
      - customer support agents
      - knowledge workers (936 task examples)
    measure:
      type: string
      role: dimension
      nullable: false
      allowed_values:
      - Issues resolved per hour
      - Self-reported critical thinking per task
      - Share of correct answers on a task built so AI gives a convincing wrong answer
      - Tasks completed, speed, quality (tasks AI handles well)
      - Time to complete a writing task; graded quality
      - Worker learning (as described in the abstract)
    finding:
      type: string
      role: dimension
      nullable: false
      allowed_values:
      - Access to the AI assistant raised issues resolved per hour by 14% on average, including 34% for novice and low-skilled
        workers, with minimal impact on experienced workers.
      - Consultants with AI finished 12.2% more tasks, 25.1% more quickly, with output quality scored 40% higher. The lowest-scoring
        consultants at baseline improved most.
      - Higher confidence in GenAI was associated with less perceived critical thinking (beta = -0.69, p < .001). Higher self-confidence
        was associated with more perceived critical thinking (beta = 0.26, p = .026).
      - On a task designed so that AI would give a convincing wrong answer, unaided consultants were correct 84% of the time,
        versus 60 to 70% for those using AI.
      - The authors report evidence of possible worker learning alongside the productivity gains. This is a hint in the abstract,
        so read the paper before relying on it.
      - Treated workers finished about 37% faster (about 10 minutes less than a 27-minute control average), and output grades
        rose by about 0.4 to 0.45 standard deviations. Gaps between workers narrowed.
    direction:
      type: string
      role: dimension
      nullable: false
      allowed_values:
      - gain
      - loss
    evidence_strength:
      type: string
      role: dimension
      nullable: false
      allowed_values:
      - High
      - Low
      - Medium
    strength_rationale:
      type: string
      role: dimension
      nullable: false
      allowed_values:
      - Described as 'possible' in the abstract, and I have not read the underlying analysis.
      - Large sample and real workplace data, but a single firm and a single job.
      - Randomised assignment, but a short, writing-only task done in an online setting.
      - Randomised, pre-registered, and run with real consultants, but one firm.
      - Same randomised design, but this is one task built to trip the AI up, so it shows a risk and not a typical effect.
      - Self-reported perceptions from a recruited sample. It shows association only, not measured skill.
    source_url:
      type: string
      role: dimension
      nullable: false
      allowed_values:
      - https://advait.org/files/lee_2025_ai_critical_thinking_survey.pdf
      - https://economics.mit.edu/sites/default/files/inline-files/Noy_Zhang_1_0.pdf
      - https://papers.ssrn.com/abstract=4573321
      - https://www.nber.org/papers/w31161
    location_in_source:
      type: string
      role: dimension
      nullable: false
      allowed_values:
      - Abstract
      - Abstract (NBER WP 31161; later published in QJE 2025)
      - Abstract and results (MIT working paper version; the published Science version may report slightly different figures)
      - Section 4.2.1 (Table 4); interpretation in Section 6.1.1
      - Working paper (SSRN 4573321)
    check_status:
      type: string
      role: dimension
      nullable: false
      allowed_values:
      - Read a summary of the paper only. Open the paper and confirm figures before presenting
      - Read the NBER abstract page
      - Read the NBER abstract page only. Open the paper to see the evidence
      - Read the paper PDF (page numbers not checked)
      - Read the working paper PDF
