schema_version: 2
title: 'AI: Gains vs Hidden Costs - data dictionary'
description: 'Machine-readable data dictionary in the Assignment 2 Part C standard. `sources` and `datasets` follow the A2
  manifest schema; `transforms` gives the step that produced each processed file. Built by scripts/build_dictionary.py from
  the files in data/. Dates are read as the A2 checker reads them: a year such as 2025 is 2025-01-01 and a quarter such as
  2026-Q3 is 2026-07-01.'
pipelines:
- part: Profitability
  acquisition_method: manual download
  acquisition_path: data/raw
  transform_command:
  - python
  - src/narrative/tabs/profitability/build_processed.py
- part: Feedback loop and cognition
  acquisition_method: copy from cited repositories and papers
  acquisition_path: src/narrative/human_practice_data.py
  transform_command:
  - python
  - -m
  - narrative.human_practice_data
- part: Moral degradation
  acquisition_method: script
  acquisition_path: scripts/data.py
  transform_command:
  - python
  - scripts/data.py
