datasets:
- id: owid_share_companies_using_artificial_intelligence
  source_ids:
  - owid_ai_adoption
  sample: data/raw/owid_share-companies-using-artificial-intelligence.csv
  processed_output: data/processed/owid_share-companies-using-artificial-intelligence.csv
  format: csv
  date_column: Year
  latest_observation: '2025-01-01'
  primary_key:
  - Entity
  - Year
  minimum_rows: 30
  columns:
    Entity:
      type: string
      role: geography
      nullable: false
      allowed_values:
      - All geographies
      - Asia-Pacific
      - Developing markets
      - Europe
      - Greater China
      - North America
    Code:
      type: string
      role: geography
      nullable: true
      allowed_values:
      - OWID_EUR
      - OWID_NAM
    Year:
      type: date
      role: time
      nullable: false
      date_minimum: '2021-01-01'
      date_maximum: '2025-01-01'
    Organizations reporting having adopted AI:
      type: number
      role: measure
      nullable: false
      unit: '% of organisations using AI in at least one business function'
      minimum: 41.0
      maximum: 91.0
