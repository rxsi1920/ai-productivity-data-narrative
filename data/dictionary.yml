        identifies information-security risks including attacks on AI models model-deception attacks vulnerabilities unauthorized
        access and data leakage (Appendix D – Risk Classification).It recommends Red Teaming controlled attacks guardrails
        privacy-enhancing technologies secure data governance and monitoring as protection measures (Appendix D – Risk Mitigation
        Measures).
