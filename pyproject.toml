[project]
name = "ai-productivity-data-narrative"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rxsi1920", email = "preranapinakoppa192@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "altair>=6.3.0",
    "pandas>=3.1.0",
    "streamlit>=1.66.1",
]

[project.scripts]
ai-productivity-data-narrative = "narrative:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv.build-backend]
module-name = "narrative"
